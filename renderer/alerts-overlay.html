<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="/i18n.js"></script>
<title>FlightBrief — Alertes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@500;600;700&family=Rajdhani:wght@600;700&family=Oswald:wght@500;600&family=Chakra+Petch:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Inter:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:rgba(14,18,24,.94); --bg2:rgba(10,13,17,.94); --panel:#12171c; --line:rgba(231,237,242,.1); --text:#e7edf2; --sub:#8a96a2; --ok:#39e88f; --ifr:#54d6e8; --vfr:#ffb020; --bad:#ff5c5c; --gold:#ffd166; --scale:1;
    --radius:18px; --w:420px; --font:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace; --tile:rgba(255,255,255,.04); --cardline:rgba(231,237,242,.1); --bw:1px; --fs:1; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:transparent; overflow:hidden; width:100vw; height:100vh;}
  body{font-family:var(--font); color:var(--text);}
  .stack{position:fixed; display:flex; flex-direction:column; gap:14px; padding:36px; transform:scale(var(--scale));}
  .pos-top-right{top:0; right:0; align-items:flex-end; transform-origin:top right;}
  .pos-top-left{top:0; left:0; align-items:flex-start; transform-origin:top left;}
  .pos-bottom-right{bottom:0; right:0; align-items:flex-end; flex-direction:column-reverse; transform-origin:bottom right;}
  .pos-bottom-left{bottom:0; left:0; align-items:flex-start; flex-direction:column-reverse; transform-origin:bottom left;}
  .pos-center{top:50%; left:50%; transform:translate(-50%,-50%) scale(var(--scale)); align-items:center; transform-origin:center;}
  .pos-preview{position:static; padding:16px; display:grid; grid-template-columns:repeat(2, max-content); gap:14px; transform:none; align-items:start;}
  .pos-preview .al .timer{animation-iteration-count:infinite;}

  .al{position:relative; width:calc(var(--w) / var(--fs)); zoom:var(--fs); background:linear-gradient(160deg, var(--bg), var(--bg2)); border:var(--bw) solid var(--cardline); border-radius:var(--radius); padding:18px 20px; overflow:hidden; animation:alIn .55s cubic-bezier(.2,1.2,.3,1) both;}
  body.shadow .al{box-shadow:0 24px 60px rgba(0,0,0,.45);}
  body.blur .al{backdrop-filter:blur(10px);}
  body.no-border .al{border-color:transparent;}
  body.no-stripe .al::before{display:none;}
  body.no-timer .al .timer{display:none;}
  body.anim-fade .al{animation-name:alFade; animation-duration:.5s; animation-timing-function:ease;}
  body.anim-pop .al{animation-name:alPop; animation-duration:.6s;}
  body.anim-slide .al{animation-name:alSlide; animation-duration:.55s;}
  body.anim-none .al{animation:none;}
  .al.out{animation:alOut .45s ease-in both !important;}
  .al::before{content:''; position:absolute; inset:0 auto 0 0; width:4px; background:var(--accent, var(--ifr));}
  @keyframes alFade{from{opacity:0;} to{opacity:1;}}
  @keyframes alPop{0%{opacity:0; transform:scale(.6);} 70%{transform:scale(1.04);} 100%{opacity:1; transform:none;}}
  @keyframes alSlide{0%{opacity:0; transform:translateX(60px);} 100%{opacity:1; transform:none;}}
  .pos-top-left .al, .pos-bottom-left .al{--slide-dir:-1;}
  body.anim-slide .pos-top-left .al, body.anim-slide .pos-bottom-left .al{animation-name:alSlideL;}
  @keyframes alSlideL{0%{opacity:0; transform:translateX(-60px);} 100%{opacity:1; transform:none;}}
  /* Thèmes */
  body.th-neon .al{border-color:var(--accent); box-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 18px color-mix(in srgb, var(--accent) 18%, transparent);}
  body.th-neon .al::before{display:none;}
  body.th-minimal .al{background:var(--bg); border:none; padding:14px 16px;}
  body.th-minimal .al::before{width:3px;}
  body.th-light .eyebrow, body.th-light .ld-stats span, body.th-light .rwy-cap, body.th-light .chat .to, body.th-light .pod .g{color:var(--sub);}
  .al .timer{position:absolute; left:0; bottom:0; height:3px; background:var(--accent, var(--ifr)); opacity:.7; animation:timer linear both;}
  @keyframes alIn{0%{opacity:0; transform:translateY(-18px) scale(.94);} 100%{opacity:1; transform:none;}}
  @keyframes alOut{to{opacity:0; transform:translateX(40px) scale(.97);}}
  @keyframes timer{from{width:100%;} to{width:0%;}}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--sub); font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* Atterrissage */
  .ld-top{display:flex; gap:16px; align-items:center;}
  .ld-letter{width:84px; height:84px; flex:none; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; color:var(--accent);
    background:color-mix(in srgb, var(--accent) 13%, transparent); border:1px solid color-mix(in srgb, var(--accent) 50%, transparent); text-shadow:0 0 22px color-mix(in srgb, var(--accent) 60%, transparent);
    animation:pop .7s .25s cubic-bezier(.2,1.7,.4,1) both;}
  @keyframes pop{0%{transform:scale(.2) rotate(-20deg); opacity:0;} 100%{transform:none; opacity:1;}}
  .ld-fpm{font-family:var(--mono); font-size:34px; font-weight:600; line-height:1.1; margin:3px 0 2px;}
  .ld-grade{font-size:14px; font-weight:600;}
  .ld-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px;}
  .ld-stats div{background:var(--tile); border:1px solid var(--line); border-radius:10px; padding:7px 9px;}
  .ld-stats span{display:block; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--sub);}
  .ld-stats b{font-family:var(--mono); font-size:14px;}
  .rwy{position:relative; height:34px; margin-top:12px; border-radius:4px; background:#2a3138; border:1px solid rgba(231,237,242,.15); overflow:hidden;}
  .rwy .tdz{position:absolute; top:0; bottom:0; left:0; background:rgba(57,232,143,.12);}
  .rwy .cl{position:absolute; left:3%; right:3%; top:50%; border-top:2px dashed rgba(231,237,242,.35);}
  .rwy .thr{position:absolute; left:4px; top:5px; bottom:5px; width:10px; background:repeating-linear-gradient(0deg, rgba(231,237,242,.7) 0 2px, transparent 2px 5px);}
  .rwy .dot{position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--bad); border:2px solid #fff; box-shadow:0 0 12px var(--bad); animation:pop .6s .6s both;}
  .rwy-cap{display:flex; justify-content:space-between; font-size:10.5px; color:var(--sub); margin-top:4px;}

  /* Paris */
  .bt-actual{font-family:var(--mono); font-size:30px; font-weight:600; margin:4px 0 10px;}
  .podium{display:flex; gap:8px;}
  .pod{flex:1; text-align:center; padding:8px 6px; border:1px solid var(--line); border-radius:12px; background:var(--tile);}
  .pod.p1{border-color:rgba(255,209,102,.6); background:rgba(255,209,102,.08);}
  .pod .m{font-size:22px;}
  .pod .n{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pod .g{font-family:var(--mono); font-size:11.5px; color:var(--sub);}
  .banner{display:flex; align-items:center; gap:14px;}
  .banner .ic{font-size:30px;}
  .banner .t{font-size:20px; font-weight:700;}
  .banner .s{font-size:14px; color:var(--sub); margin-top:2px;}
  .banner code{font-family:var(--mono); color:var(--ifr); background:rgba(84,214,232,.12); padding:1px 6px; border-radius:5px;}

  /* Succès */
  .ach{display:flex; gap:16px; align-items:center;}
  .ach .badge{width:70px; height:70px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px; background:radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, transparent), color-mix(in srgb, var(--accent) 5%, transparent) 70%); border:1px solid color-mix(in srgb, var(--accent) 60%, transparent); animation:pop .8s .2s cubic-bezier(.2,1.7,.4,1) both;}
  .ach .t{font-size:22px; font-weight:700; margin:2px 0;}
  .ach .d{font-size:14px; color:var(--sub);}

  /* Réponse du bot */
  .chat .who{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .chat .bot{background:#9146ff; color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; letter-spacing:.04em;}
  .chat .to{font-size:12px; color:var(--sub);}
  .chat .txt{font-size:17px; line-height:1.4; font-weight:500;}

  /* À bord (v1.7) */
  .cb-names{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .cb-names span{font-size:13.5px; font-weight:600; padding:3px 10px; border-radius:20px; background:var(--tile); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);}
  .cb-names span.more{color:var(--sub); font-weight:500;}
  .fb-rainbow{background:linear-gradient(90deg,#ff6b6b,#ffd166,#39e88f,#5cc8ff,#a06cf5); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .cb-note{font-size:13px; color:var(--sub); margin-top:8px;}
  .cb-note b{color:var(--text);}
  .cb-big{display:flex; gap:16px; align-items:center;}
  .cb-big .ic{width:70px; height:70px; flex:none; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:36px; background:color-mix(in srgb, var(--accent) 16%, transparent); border:1px solid color-mix(in srgb, var(--accent) 50%, transparent); animation:pop .7s .2s cubic-bezier(.2,1.7,.4,1) both;}
  .cb-big .t{font-size:22px; font-weight:700; line-height:1.15; margin:2px 0;}
  .cb-big .s{font-size:14.5px; color:var(--sub);}
  .cb-big .bonus{display:inline-block; margin-top:6px; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent);}
  .cb-q{font-size:18px; font-weight:600; line-height:1.35; margin:6px 0 8px;}
  .cb-list{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
  .cb-list div{display:flex; justify-content:space-between; gap:10px; font-size:14px;}
  .cb-list div span{color:var(--sub);}
  .cb-card{margin:-18px -20px; }
  .cb-card img{display:block; width:100%; border-radius:var(--radius) var(--radius) 0 0;}
  .cb-card .cap{padding:10px 16px 14px; font-size:14px;}
  .cb-card .cap b{font-size:16px;}
  code{font-family:var(--mono); color:var(--ifr); background:rgba(84,214,232,.12); padding:1px 6px; border-radius:5px;}
</style>
</head>
<body>
<div class="stack pos-top-right" id="stack"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg = { durationSec: 9, position: 'top-right', scale: 100, types: { landing: true, bet: true, achievement: true, chat: true, cabin: true }, style: {} };
const PREVIEW = new URLSearchParams(location.search).has('preview');
// v1.9 — noms des commandes (renommables dans l'onglet Twitch), fournis par /api/alerts.
let CMDS = {};
const cmd = (k, d) => esc(CMDS[k] || d);
// Pseudo avec la couleur achetée au duty free (look = { badge, title, color }).
const pseudo = (name, lk) => { lk = lk || {}; return `${lk.badge ? esc(lk.badge) + ' ' : ''}<span class="${lk.color === 'rainbow' ? 'fb-rainbow' : ''}"${lk.color && lk.color !== 'rainbow' ? ` style="color:${esc(lk.color)}"` : ''}>${esc(name)}</span>`; };
function hexA(hex, a){
  const h = String(hex || '#0a0d11').replace('#','');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h.padEnd(6, '0');
  return `rgba(${parseInt(n.slice(0,2),16)||0},${parseInt(n.slice(2,4),16)||0},${parseInt(n.slice(4,6),16)||0},${(Math.max(0, Math.min(100, a)) / 100).toFixed(2)})`;
}
// Thèmes prêts à l'emploi : valeurs de départ, toutes modifiables ensuite.
const THEMES = {
  flightbrief: { bg:'#181e25', bg2:'#0c1014', text:'#e7edf2', sub:'#8a96a2', opacity:94 },
  glass:       { bg:'#1b2430', bg2:'#0f141b', text:'#ffffff', sub:'#b7c3cf', opacity:62 },
  neon:        { bg:'#07080d', bg2:'#07080d', text:'#f2f5ff', sub:'#8d93b8', opacity:88 },
  minimal:     { bg:'#0b0e12', bg2:'#0b0e12', text:'#f0f3f6', sub:'#8a96a2', opacity:80 },
  light:       { bg:'#ffffff', bg2:'#eef2f6', text:'#0f1720', sub:'#5b6875', opacity:96 }
};
let lastId = null;
const queue = [];
let showing = 0;
const MAX_VISIBLE = 3;

function category(t){ return t === 'landing' ? 'landing' : t === 'achievement' ? 'achievement' : t === 'chat-answer' ? 'chat' : t.startsWith('bet') ? 'bet' : t.startsWith('cabin-') ? 'cabin' : null; }
function fpm(v){ return v == null ? '—' : '−' + Math.abs(Math.round(v)) + ' ft/min'; }

function landingHtml(e){
  const a = e.data || {};
  const z = a.zone;
  const pct = z ? Math.max(1, Math.min(99, z.percentAlongRunway || 0)) : null;
  const lat = z ? Math.max(-14, Math.min(14, (z.lateralOffsetFt || 0) / 6)) * (z.side === 'droite' ? 1 : -1) : 0;
  const tdz = z && z.lengthFt ? Math.min(100, 3000 / z.lengthFt * 100) : 25;
  return { accent: a.color || '#54d6e8', html: `
    <div class="ld-top">
      <div class="ld-letter">${esc(a.letter || '—')}</div>
      <div>
        <div class="eyebrow">${esc(cardLabel('landing', 'Atterrissage'))}${a.icao ? ' · ' + esc(a.icao) : ''}${z ? ' · piste ' + esc(String(z.runway).split('/')[0]) : ''}</div>
        <div class="ld-fpm">${esc(fpm(a.fpm))}</div>
        <div class="ld-grade" style="color:${esc(a.gradeColor || '#e7edf2')}">${esc(a.gradeLabel || '')}${a.score != null ? ' · ' + a.score + '/100' : ''}</div>
      </div>
    </div>
    <div class="ld-stats">
      <div><span>Facteur G</span><b>${a.gForce != null ? Number(a.gForce).toFixed(2) : '—'}</b></div>
      <div><span>Rebonds</span><b>${a.bounces || 0}</b></div>
      <div><span>Vent</span><b>${a.windKt != null ? String(a.windDir ?? 0).padStart(3,'0') + '/' + a.windKt : '—'}</b></div>
      <div><span>Travers</span><b>${a.crosswindKt != null ? Math.abs(a.crosswindKt) + ' kt' : '—'}</b></div>
    </div>
    ${z ? `<div class="rwy"><div class="tdz" style="width:${tdz}%"></div><div class="thr"></div><div class="cl"></div><div class="dot" style="left:${pct}%; top:calc(50% + ${lat}px)"></div></div>
    <div class="rwy-cap"><span>Seuil ${esc(String(z.runway).split('/')[0])}</span><span>${(z.distanceFromThresholdFt || 0).toLocaleString(FBI18N.locale())} ft après le seuil · ${z.lateralOffsetFt || 0} ft à ${esc(z.side || '')}</span></div>` : ''}` };
}
function betHtml(e){
  if(e.type === 'bet-result' && e.data){
    const r = e.data;
    const medals = ['🥇','🥈','🥉'];
    return { accent: '#ffd166', html: `<div class="eyebrow">${esc(e.title || 'Pari d\'atterrissage')}</div>
      <div class="bt-actual">${esc(fpm(r.actual))}</div>
      ${(r.podium || []).length ? `<div class="podium">${r.podium.map((p, i) => `<div class="pod p${i+1}"><div class="m">${medals[i]}</div><div class="n">${esc(p.name)}</div><div class="g">${p.fpm} · ±${p.diff}</div></div>`).join('')}</div>` : '<div class="banner"><div class="s">Personne n\'avait parié cette fois.</div></div>'}` };
  }
  const open = e.type === 'bet-open';
  return { accent: open ? '#39e88f' : '#ffb020', html: `<div class="banner"><div class="ic">${open ? '🛬' : '🔒'}</div><div><div class="t">${esc(e.title)}</div><div class="s">${open ? `Devine le taux de toucher : <code>${cmd('pari', '!pari')} 180</code>` : esc(e.text || '')}</div></div></div>` };
}
function achHtml(e){
  return { accent: '#ffd166', html: `<div class="ach"><div class="badge">${esc(e.icon || '🏆')}</div><div><div class="eyebrow">${esc(cardLabel('achievement', 'Succès débloqué'))}</div><div class="t">${esc(e.title)}</div><div class="d">${esc(e.text || '')}</div></div></div>` };
}
function chatHtml(e){
  return { accent: '#9146ff', html: `<div class="chat"><div class="who"><span class="bot">${esc(e.title || 'FlightBot')}</span>${e.user ? `<span class="to">répond à ${esc(e.user)}</span>` : ''}</div><div class="txt">${esc(e.text)}</div></div>` };
}
// Cartes « À bord » : embarquement, survols, vue du hublot, quiz, heure d'arrivée, carte postale.
function cabinHtml(e){
  const d = e.data || {};
  const lbl = cardLabel('cabin', '');
  const eb = t => `<div class="eyebrow">${esc(lbl || t)}</div>`;
  const big = (ic, eyebrow, t, s, extra, accent) => ({ accent: accent || '#39e88f', html: `<div class="cb-big"><div class="ic">${ic}</div><div>${eb(eyebrow)}<div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}${extra || ''}</div></div>` });
  switch(e.type){
    case 'cabin-open': return big('🛫', 'Embarquement ouvert', esc(e.text || 'Vol au départ'), `Tape <code>${cmd('board', '!embarquer')}</code> pour monter à bord`);
    case 'cabin-boarding': return { accent: '#39e88f', html: `${eb('Embarquement · ' + (d.total || 0) + ' à bord')}
      <div class="cb-names">${(d.names || []).map((n, i) => `<span>${pseudo(n, (d.looks || [])[i])}</span>`).join('')}${d.more ? `<span class="more">+${d.more}</span>` : ''}</div>
      ${(d.connections || []).length ? `<div class="cb-note">🧳 Correspondance : ${d.connections.slice(0, 3).map(c => `<b>${esc(c.name)}</b> (${c.leg}e vol)`).join(', ')}</div>` : ''}` };
    case 'cabin-flyover': return big('🏠', 'Survol', `On survole chez ${esc(d.name)} !`, `${esc(d.flag || '')} ${esc(d.city || '')} · coucou en bas 👋`, d.aboard ? '<div class="bonus">+150 miles</div>' : '', '#ffd166');
    case 'cabin-flyover-soon': return big('👀', 'Survol imminent', `Dans ~${esc(d.etaMin)} min : chez ${esc(d.name)}`, `${esc(d.flag || '')} ${esc(d.city || '')}`, '', '#ffd166');
    case 'cabin-window': return big('🪟', 'Vue du hublot', d.city ? `${esc(d.city)} ${esc(d.flag || '')}` : 'Rien que le paysage', [d.where, d.alt, d.gs != null ? d.gs + ' kt sol' : ''].filter(Boolean).map(esc).join(' · '), '', '#54d6e8');
    case 'cabin-country': return big(esc(d.flag || '🌍'), 'Nouveau pays sous nos ailes', esc(d.name || ''), '', '', '#54d6e8');
    case 'cabin-route': return { accent: '#ffd166', html: `${eb('Au programme de ce vol')}<div class="cb-q">On survolera chez :</div>
      <div class="cb-list">${(d.list || []).map(x => `<div><b>${esc(x.name)}</b><span>${esc(x.flag || '')} ${esc(x.city)}</span></div>`).join('')}${d.more ? `<div><span>et ${d.more} autres…</span></div>` : ''}</div>` };
    case 'cabin-quiz': return { accent: '#a06cf5', html: `${eb('🧭 Quiz du hublot · +50 miles')}<div class="cb-q">${esc(d.text || '')}</div><div class="cb-note">Réponds avec <code>${cmd('answer', '!rep')} …</code></div>` };
    case 'cabin-quiz-result': return big('🧭', 'Quiz du hublot', `Réponse : ${esc(d.answer || '')}`, d.winner ? `Bravo <b>${esc(d.winner)}</b> !` : 'Personne n\'a trouvé cette fois', d.winner ? '<div class="bonus">+50 miles</div>' : '', '#a06cf5');
    case 'cabin-arrival-open': return big('⏱️', "Heure d'arrivée", `À quelle heure on touche${d.arr ? ' à ' + esc(d.arr) : ''} ?`, `Pronostique : <code>${cmd('arrival', '!arrivee')} 21:47</code>`, '', '#54d6e8');
    case 'cabin-arrival-result': return big('⏱️', "Heure d'arrivée", `Toucher à ${esc(d.time || '')}`, d.winner ? `Bravo <b>${esc(d.winner)}</b> (${esc(d.guess || '')})` : '', d.winner ? '<div class="bonus">+100 miles</div>' : '', '#54d6e8');
    case 'cabin-turbulence': return big('⚠️', 'Turbulences', 'Attachez vos ceintures !', `Tapez <code>${cmd('seatbelt', '!ceinture')}</code> dans les ${esc(d.sec || 60)} s`, d.penalty ? `<div class="bonus">−${esc(d.penalty)} miles sinon</div>` : '', '#ff6b6b');
    case 'cabin-turbulence-result': return big(d.hitCount ? '😵' : '✅', 'Turbulences', 'Signal ceinture éteint', d.hitCount ? `Sans ceinture : ${(d.hit || []).map(esc).join(', ')}${d.hitCount > (d.hit || []).length ? '…' : ''}` : 'Tout le monde était attaché, bravo !', d.hitCount && d.penalty ? `<div class="bonus">−${esc(d.penalty)} miles</div>` : '', '#ff6b6b');
    case 'cabin-dutyfree': return big(esc(d.icon || '🛍️'), 'Duty free', `${pseudo(d.name, d.look)} s'offre ${esc(d.item || '')}`, '', '', '#a06cf5');
    case 'cabin-tier': return big(esc(e.icon || '🎫'), 'Nouveau statut', esc(e.title || ''), esc(e.text || ''), '', '#ffd166');
    case 'cabin-postcard': return { accent: '#ffd166', html: `<div class="cb-card"><img src="${esc(d.url || '')}" alt=""><div class="cap">${eb('Carte postale')}<b>Bons baisers${d.city ? ' de ' + esc(d.city) : ''} !</b></div></div>` };
    default: return big('🎫', 'À bord', esc(e.title || ''), esc(e.text || ''));
  }
}
function renderForce(e){
  const c = category(e.type);
  const r = c === 'landing' ? landingHtml(e) : c === 'bet' ? betHtml(e) : c === 'achievement' ? achHtml(e) : c === 'cabin' ? cabinHtml(e) : chatHtml(e);
  return { ...r, accent: accentFor(r.accent, c) };
}
function render(e){
  const c = category(e.type);
  if(!c || cfg.types[c] === false) return null;
  return renderForce(e);
}
function pump(){
  while(showing < MAX_VISIBLE && queue.length){
    const e = queue.shift();
    const r = render(e);
    if(!r) continue;
    const dur = (e.type === 'cabin-quiz' || e.type === 'cabin-turbulence') && e.data && e.data.sec ? Math.min(90, e.data.sec)
      : (e.type === 'landing' || e.type === 'bet-result' || e.type === 'cabin-postcard' ? 1.6 : e.type === 'chat-answer' || e.type === 'cabin-flyover' || e.type === 'cabin-route' ? 1.1 : 0.8) * (cfg.durationSec || 9);
    const n = document.createElement('div');
    n.className = 'al';
    n.style.setProperty('--accent', r.accent);
    n.innerHTML = r.html + `<div class="timer" style="animation-duration:${dur}s"></div>`;
    $('stack').appendChild(n);
    chime(e.type);
    showing++;
    setTimeout(() => { n.classList.add('out'); setTimeout(() => { n.remove(); showing--; pump(); }, 450); }, dur * 1000);
  }
}
let _cfgSig = '';
function applyCfg(c){
  if(!c) return;
  cfg = { ...cfg, ...c, types: { ...cfg.types, ...(c.types || {}) }, style: { ...(c.style || {}) } };
  const sig = JSON.stringify(cfg);
  if(sig === _cfgSig) return;
  _cfgSig = sig;
  $('stack').className = 'stack pos-' + (PREVIEW ? 'preview' : (cfg.position || 'top-right'));
  const st = cfg.style || {}, th = THEMES[st.theme] || THEMES.flightbrief;
  const r = document.documentElement.style;
  const op = st.opacity != null ? st.opacity : th.opacity;
  r.setProperty('--scale', PREVIEW ? 1 : (cfg.scale || 100) / 100);
  r.setProperty('--bg', hexA(st.bg || th.bg, op));
  r.setProperty('--bg2', hexA(st.gradient === false ? (st.bg || th.bg) : (st.bg2 || st.bg || th.bg2), op));
  r.setProperty('--text', st.text || th.text);
  r.setProperty('--sub', st.sub || th.sub);
  r.setProperty('--radius', (st.radius != null ? st.radius : 18) + 'px');
  r.setProperty('--w', (st.width || 420) + 'px');
  r.setProperty('--font', st.font || "'Space Grotesk',sans-serif");
  r.setProperty('--line', st.theme === 'light' ? 'rgba(15,23,32,.12)' : 'rgba(231,237,242,.1)');
  r.setProperty('--cardline', st.borderColor ? hexA(st.borderColor, st.borderAlpha || (st.theme === 'light' ? 16 : 14)) : (st.theme === 'light' ? 'rgba(15,23,32,.12)' : 'rgba(231,237,242,.1)'));
  r.setProperty('--bw', (st.borderWidth || 1) + 'px');
  r.setProperty('--fs', Math.max(0.7, Math.min(1.5, (st.textScale || 100) / 100)));
  r.setProperty('--tile', st.theme === 'light' ? 'rgba(15,23,32,.05)' : 'rgba(255,255,255,.04)');
  const b = document.body;
  ['th-flightbrief','th-glass','th-neon','th-minimal','th-light'].forEach(k => b.classList.remove(k));
  b.classList.add('th-' + (st.theme || 'flightbrief'));
  b.classList.toggle('shadow', st.shadow !== false);
  b.classList.toggle('blur', st.blur === true || (st.blur == null && st.theme === 'glass'));
  b.classList.toggle('no-border', st.border === false);
  b.classList.toggle('no-stripe', st.stripe === false);
  b.classList.toggle('no-timer', st.timer === false);
  ['anim-fade','anim-pop','anim-slide','anim-drop','anim-none'].forEach(k => b.classList.remove(k));
  b.classList.add('anim-' + (st.animation || 'drop'));
  if(PREVIEW) renderPreview();
}
// Couleur d'accent : celle du type d'alerte, ou une couleur unique choisie par l'utilisateur.
// v1.6.1 : couleur propre à chaque type de carte (la carte d'atterrissage peut garder la couleur de la note).
function accentFor(def, cat){
  const st = cfg.style || {};
  if(st.accentMode === 'custom' && st.accent) return st.accent;
  const card = (st.cards || {})[cat] || {};
  if(cat === 'landing' && card.byGrade !== false) return def;
  return card.color || def;
}
function cardLabel(cat, def){ const card = ((cfg.style || {}).cards || {})[cat] || {}; return card.label || def; }
// Petit carillon (Web Audio, aucun fichier) joué à l'apparition d'une alerte, si activé.
let _ac = null;
function chime(type){
  const st = cfg.style || {};
  if(!st.sound || PREVIEW) return;
  try{
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    // Courbe perçue (même réglage que dans l'appli) : 50 % ≈ −12 dB, 0 = muet.
    const v = Math.max(0, Math.min(100, st.volume != null ? st.volume : 60)) / 100, vol = v * v * 0.3;
    if(vol <= 0) return;
    const notes = type === 'achievement' ? [660, 880, 1320] : type === 'landing' || type === 'bet-result' ? [523, 784] : [784];
    notes.forEach((f, i) => {
      const o = _ac.createOscillator(), g = _ac.createGain(), t = _ac.currentTime + i * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t + 0.65);
    });
  }catch(e){ /* pas d'audio disponible */ }
}
const SAMPLES = [
  { type:'landing', data:{ fpm:-142, gForce:1.18, bounces:0, score:94, letter:'A', color:'#39e88f', gradeLabel:'Doux', gradeColor:'#54d6e8', windDir:250, windKt:12, crosswindKt:6, icao:'LFBO', zone:{ runway:'32L/14R', lengthFt:11483, distanceFromThresholdFt:1240, percentAlongRunway:11, lateralOffsetFt:6, side:'droite' } } },
  { type:'bet-result', title:'Pari gagné !', data:{ actual:142, podium:[{ name:'Viewer42', fpm:150, diff:8 }, { name:'PiloteDu59', fpm:120, diff:22 }, { name:'Kéro', fpm:180, diff:38 }], count:12 } },
  { type:'achievement', title:'Beurre', text:'Un atterrissage à moins de 100 ft/min.', icon:'🧈' },
  { type:'cabin-flyover', data:{ name:'Kéro', city:'Pézenas', flag:'🇫🇷', aboard:true } },
  { type:'chat-answer', title:'FlightBot', text:'ETA LFBO : 21:47 (dans 38 min) · 212 NM restants', user:'Viewer42' }
];
function renderPreview(){
  $('stack').innerHTML = SAMPLES.map(e => { const r = renderForce(e); return `<div class="al" style="--accent:${r.accent}">${r.html}<div class="timer" style="animation-duration:12s"></div></div>`; }).join('');
}
async function poll(){
  try{
    const r = await fetch('/api/alerts?since=' + (lastId == null ? 0 : lastId), { cache: 'no-store' });
    const j = await r.json();
    if(j.cmds) CMDS = j.cmds;
    applyCfg(j.config);
    if(PREVIEW) return;
    if(lastId == null){
      // Premier chargement (ou OBS qui recharge la source) : on ne rejoue que les 8 dernières secondes.
      (j.events || []).filter(e => Date.now() - e.ts < 8000).forEach(e => queue.push(e));
    } else (j.events || []).forEach(e => queue.push(e));
    lastId = j.lastId != null ? j.lastId : lastId;
    pump();
  }catch(e){ /* FlightBrief fermé : on réessaie */ }
}
poll();
setInterval(poll, 1000);
