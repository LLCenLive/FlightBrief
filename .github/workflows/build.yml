name: Build & Release

# Se déclenche quand tu pousses un tag de version, ex : git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'
  # Permet aussi de le lancer manuellement depuis l'onglet "Actions" de GitHub,
  # pour tester le build sans publier de Release (utile avant de taguer).
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'installeur (plateforme courante)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archiver les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: flightbrief-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la Release GitHub avec les installeurs
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
